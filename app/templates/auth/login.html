{% extends "bare.html" %}
{% from "macros.html" import csrf with context %}
{% block title %}Sign in{% endblock %}
{% block content %}
<form method="post" action="{{ url_for('auth.login') }}" class="panel login-card" autocomplete="on">
  <h1>Sign in</h1>
  <p class="page-sub">Use the account your lab administrator created for you.</p>
  {{ csrf() }}
  <input type="hidden" name="next" value="{{ next }}">
  {% if error %}<p class="error login-error" role="alert">{{ error }}</p>{% endif %}
  <div class="field">
    <label for="username">Username</label>
    <input id="username" name="username" type="text" required maxlength="40" autocomplete="username"
           autocapitalize="none" spellcheck="false" value="{{ username or '' }}" autofocus>
  </div>
  <div class="field">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password">
  </div>
  <button type="submit" class="btn btn-primary btn-block">Sign in</button>
</form>
{% endblock %}
