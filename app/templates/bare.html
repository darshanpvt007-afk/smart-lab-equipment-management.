<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sign in{% endblock %} · Smart Lab Equipment</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body class="bare">
<main class="bare-main">
  <div class="bare-brand">
    <span class="brand-mark" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 18 18"><path d="M6.5 2h5M7.5 2v5L3 15a1 1 0 0 0 .9 1.5h10.2A1 1 0 0 0 15 15l-4.5-8V2" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </span>
    <span>Smart Lab Equipment <span class="brand-sub">Management</span></span>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash flash-{{ category }}" role="alert">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
