{% extends "base.html" if current_user else "bare.html" %}
{% block title %}Error {{ code }}{% endblock %}
{% block content %}
<h1>Error {{ code }}</h1>
<p>{{ message }}</p>
<p><a class="btn" href="{{ url_for('dashboard.index') if current_user else url_for('auth.login') }}">{{ 'Back to the dashboard' if current_user else 'Go to sign in' }}</a></p>
{% endblock %}
